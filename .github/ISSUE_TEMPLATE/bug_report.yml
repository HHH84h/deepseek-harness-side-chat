name: 问题反馈
description: 反馈安装或侧聊问题，请勿上传密钥、配置和真实对话
body:
  - type: markdown
    attributes:
      value: 请只填写版本、复现步骤和已脱敏现象。不要粘贴 API key、认证 URL、完整配置、真实对话或原始日志。
  - type: input
    id: version
    attributes:
      label: 插件与 DeepSeek Harness 版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 操作步骤与实际结果
    validations:
      required: true
